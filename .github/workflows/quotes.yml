name: Notowania GPW

# Pobiera dzienne notowania spółek i indeksów GPW do data/market/*.csv i commituje zmiany.
# Zadanie dzienne (ok. 3:53 czasu warszawskiego) czyta te pliki z repozytorium.
on:
  schedule:
    - cron: "15 1 * * 1-5"   # 2:15 zimą / 3:15 latem czasu warszawskiego
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz notowania
        id: fetch
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}
        run: |
          set +e
          timeout 900 python3 -u fetch_quotes.py --budget 720 | tee fetch.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "Notowania GPW $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Zakończ błędem, gdy pobrano za mało
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "Pobrano mniej niż 50% symboli — sprawdź fetch.log i data/market/_status.json"
          exit 1
