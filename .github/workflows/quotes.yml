name: Notowania GPW

# Pobiera dzienne notowania spółek i indeksów z oficjalnego archiwum GPW do data/market/*.csv i commituje zmiany.
# Zadanie dzienne (ok. 3:53 czasu warszawskiego) czyta te pliki z repozytorium.
# Pierwsze uruchomienie robi backfill ok. 260 sesji (kilkanaście minut); kolejne pobierają 1-2 nowe sesje.
on:
  schedule:
    - cron: "15 1 * * 1-5"   # 2:15 zimą / 3:15 latem czasu warszawskiego
  workflow_dispatch:
    inputs:
      days:
        description: "Głębokość pobierania wstecz w dniach kalendarzowych"
        default: "380"
        required: false

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pobierz notowania
        id: fetch
        env:
          DAYS: ${{ inputs.days || '380' }}
        run: |
          set +e
          timeout 2700 python3 -u fetch_quotes.py --days "$DAYS" --budget 2200 | tee fetch.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Strategie i strony (Kompas, Pęd, Złoty Środek, Przystań, Dryf)
        if: always()
        run: |
          pip install -r requirements.txt
          python3 strategies.py
          python3 build.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/market strategies data/fundamentals.csv "*.html" en sitemap.xml
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "Notowania GPW $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Zakończ błędem, gdy dane niepełne lub nieświeże
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "Najnowsza sesja nieświeża, pokrycie spółek poniżej 85% albo błąd pobierania — sprawdź fetch.log i data/market/_status.json"
          exit 1
