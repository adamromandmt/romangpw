name: Próba źródeł notowań

# Tymczasowa diagnostyka: sprawdza z runnera, które źródła odpowiadają (nic nie commituje).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      - run: python3 -u tools/probe_sources.py
