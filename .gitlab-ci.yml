import:
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - |
      python3 - <<'PY'
      import os, urllib.request as u
      r = u.Request(os.environ["TRANSFER_URL"], headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"})
      open("repo.tgz", "wb").write(u.urlopen(r).read())
      PY
    - mkdir /tmp/imp && tar xzf repo.tgz -C /tmp/imp && cd /tmp/imp/romangpw
    - git config user.name "gpwradar-bot" && git config user.email "romekrugby@gmail.com"
    - URL="https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch "$URL" main
    - NEW=$(git commit-tree 'HEAD^{tree}' -p FETCH_HEAD -m "Import repozytorium")
    - git push "$URL" "$NEW:refs/heads/main"