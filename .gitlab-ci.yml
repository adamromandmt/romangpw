# Jednorazowy import repozytorium (bez Gita na komputerze). Uruchom ręcznie: Build > Pipelines > New pipeline.
import:
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - python3 -c "import urllib.request as u; u.urlretrieve('$TRANSFER_URL', 'repo.tgz')"
    - mkdir /tmp/imp && tar xzf repo.tgz -C /tmp/imp && cd /tmp/imp/romangpw
    - git config user.name "gpwradar-bot" && git config user.email "romekrugby@gmail.com"
    - URL="https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch "$URL" main
    - git merge --allow-unrelated-histories -s ours FETCH_HEAD -m "Import repozytorium"
    - git push "$URL" HEAD:main
    